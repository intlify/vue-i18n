name: Release

# Triggers:
#   - tag push (v*): publish to npm, then create the GitHub Release.
#   - workflow_dispatch: retry either job for an existing tag.
#
# CHANGELOG.md is already part of the tagged release commit produced by
# `pnpm release`. This workflow does not generate or commit the changelog.
# release-notes only creates the GitHub Release.
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v12.0.0-alpha.4). Required.
        type: string
        required: true
      dist_tag:
        description: 'Override npm dist-tag (e.g. latest, next, v11-latest). Empty = auto-detect.'
        type: string
        required: false
        default: ''

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  NODE_OPTIONS: --max-old-space-size=6144
  # Major version that currently owns the `latest` dist-tag.
  # Bump to 12 when v12 stable ships. Overridable via Repository Variables (vars.LATEST_MAJOR).
  LATEST_MAJOR: ${{ vars.LATEST_MAJOR || '11' }}
  # Major version currently developed on the master branch.
  # Bump to 13 when v13 development starts. Overridable via Repository Variables (vars.MAIN_BRANCH_MAJOR).
  MAIN_BRANCH_MAJOR: ${{ vars.MAIN_BRANCH_MAJOR || '12' }}

permissions: {}

jobs:
  npm-publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publisher authentication + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (types)
        run: pnpm build:type

      - name: Determine dist-tag
        id: dist
        env:
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [[ -n "$INPUT_DIST_TAG" ]]; then
            echo "tag=$INPUT_DIST_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR=$(echo "$TAG" | sed -nE 's/^v([0-9]+)\..*/\1/p')
          if [[ "$TAG" =~ -[a-z] ]]; then
            if [[ "$MAJOR" == "$LATEST_MAJOR" || "$MAJOR" == "$MAIN_BRANCH_MAJOR" ]]; then
              echo "tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${MAJOR}-next" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "$MAJOR" == "$LATEST_MAJOR" ]]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${MAJOR}-latest" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish packages to npm
        # Authenticated via OIDC trusted publisher (requires id-token: write, no secret needed).
        # Provenance is automatically attached through OIDC.
        run: |
          for PKG in packages/*; do
            [[ -d "$PKG" ]] || continue
            case "$PKG" in
              packages/size-*|packages/format-explorer) continue ;;
            esac
            echo "Publishing $PKG with tag $DIST_TAG"
            (cd "$PKG" && pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG")
          done
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}

  release-notes:
    needs: [npm-publish]
    if: >-
      always() && (
        (github.event_name == 'push' &&
          needs.npm-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release
    steps:
      - name: Checkout tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            MAJOR=$(echo "$TAG" | sed -nE 's/^v([0-9]+)\..*/\1/p')
            # SemVer prerelease: '-' after major.minor.patch, not build metadata.
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            elif [[ "$MAJOR" == "$LATEST_MAJOR" ]]; then
              FLAGS+=(--latest)
            else
              FLAGS+=(--latest=false)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
