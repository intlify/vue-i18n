name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/**
  pull_request:
    branches: ['**']
    paths:
      - .github/workflows/**

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/
          # With Advanced Security (SARIF), zizmor never fails the job, so findings go unnoticed.
          # Fail the job on findings instead, and show them as annotations on the pull request.
          advanced-security: false
          annotations: true
