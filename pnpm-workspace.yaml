packages:
  - 'packages/*'
  - 'examples/**/*'
  - '!examples/frameworks/nuxt3'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vue
  - '@vue/compiler-dom'
  - '@vue/shared'
  - '@vue/runtime-vapor'
  - '@vue/server-renderer'
  - '@vue/compiler-sfc'
  - '@vue/runtime-dom'
  - '@vue/reactivity'
  - '@vue/compiler-vapor'
  - '@vue/compiler-ssr'
  - '@vue/runtime-core'
  - '@vue/compiler-core'
  - '@kazupon/eslint-config'
  - vitest
  - '@vitest/mocker'
  - '@vitest/pretty-format'
  - '@vitest/snapshot'
  - '@vitest/spy'
  - '@vitest/runner'
  - '@vitest/expect'
  - '@vitest/utils'
  - '@vitest/coverage-v8'
  # Renovate security update: vite@7.3.2 || 7.3.5
  - vite@7.3.2 || 7.3.5
  # vitepress-api-references@0.3.0 and its ox-content 3 alpha are newer than minimumReleaseAge
  - vitepress-api-references
  - '@ox-content/napi'
  - '@ox-content/binding-darwin-arm64'
  - '@ox-content/binding-darwin-x64'
  - '@ox-content/binding-linux-x64-gnu'
  - '@ox-content/binding-linux-x64-musl'
  - '@ox-content/binding-linux-arm64-gnu'
  - '@ox-content/binding-linux-arm64-musl'
  - '@ox-content/binding-win32-x64-msvc'
